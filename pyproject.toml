[project]
name = "taxidemand"
version = "0.1.0"
description = "NYC taxi zone-hour demand forecasting for fleet operations"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "duckdb>=1.0",
    "requests>=2.31",
    "lightgbm>=4.3",
    "scikit-learn>=1.4",
    "holidays>=0.50",
    "shap>=0.45",
    "mlflow>=2.12",
    "streamlit>=1.40",
    "plotly>=5.24",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5", "jupyter>=1.0", "nbconvert>=7", "ipykernel>=6", "pyshp>=2.3", "pyproj>=3.6", "shapely>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taxidemand"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "app"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
